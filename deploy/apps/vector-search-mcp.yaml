apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-search-mcp
  namespace: doc-research-lab
  labels:
    app: vector-search-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-search-mcp
  template:
    metadata:
      labels:
        app: vector-search-mcp
    spec:
      containers:
        - name: vector-search-mcp
          image: ${REGISTRY}/rhoai-custom-research-lab/vector_search_mcp:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 9002
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /mcp/
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /mcp/
              port: 9002
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: LLAMA_STACK_URL
              valueFrom:
                secretKeyRef:
                  name: doc-research-secret
                  key: LLAMA_STACK_URL
            - name: LLAMA_STACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doc-research-secret
                  key: LLAMA_STACK_API_KEY
            - name: VERIFY_SSL
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: vector-search-mcp
  namespace: doc-research-lab
  labels:
    app: vector-search-mcp
spec:
  selector:
    app: vector-search-mcp
  ports:
    - name: http
      port: 9002
      targetPort: 9002
      protocol: TCP
